<!DOCTYPE html>
<html>
    <head>
        <title>TerryPick! - Court Profile</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/16117/16117721.png">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="top-nav">
            <div class="top-nav-left">
                <a href="Home Page.html" class="brand">
                    <img src="https://cdn-icons-png.flaticon.com/512/16117/16117721.png" alt="TerryPick Logo" class="logo">
                    <span class="brand-text">TerryPick</span>
                </a>
            </div>

            <div class="top-nav-right">
                <a href="About Us.html">About Us</a>
                <a class="btn btn-ghost" href="Home Page.html">Home</a>
                <a id="nav-login" href="Login Page.html">Login</a>
                <a id="nav-profile" class="btn btn-ghost" href="Profile Page.html" style="display:none;">Profile</a>

                <!-- NEW -->
                <a id="nav-owner" class="btn btn-ghost" href="Owner Dashboard.html" style="display:none;">Owner Dashboard</a>

                <a id="nav-primary" class="btn btn-primary" href="Signup Page.html">Sign Up</a>
            </div>
        </div>

        <main class="page">
            <section class="profile-hero">
                <div id="court-avatar" class="profile-avatar" aria-hidden="true">TP</div>

                <div class="profile-hero-text">
                    <h1 id="court-name" class="profile-name">Court</h1>
                    <p id="court-meta" class="profile-meta"></p>

                    <div class="profile-actions">
                        <a id="btn-book" class="btn btn-primary" href="Login Page.html">Book a slot</a>

                        <!-- NEW: only shows if owner is viewing their own court -->
                        <a id="btn-manage" class="btn btn-ghost" href="Owner Dashboard.html" style="display:none;">Manage court</a>

                        <a class="btn btn-ghost" href="Home Page.html">Back to Home</a>
                    </div>
                </div>
            </section>

            <section class="home-section">
                <h2 class="home-section-title">At a glance</h2>

                <div class="card-grid">
                    <article class="card">
                        <h3 class="card-title">Amenities</h3>
                        <div id="court-amenities" class="card-text"></div>
                    </article>

                    <article class="card">
                        <h3 class="card-title">Rates (sample)</h3>
                        <div id="court-rates" class="card-text"></div>
                    </article>

                    <article class="card">
                        <h3 class="card-title">Rules</h3>
                        <div id="court-rules" class="card-text"></div>
                    </article>
                </div>
            </section>

            <section class="home-section">
                <h2 class="home-section-title">Today’s availability (sample)</h2>

                <div id="court-availability" class="card-grid"></div>
            </section>

            <section class="home-section">
                <h2 class="home-section-title">Location (sample)</h2>
                <div id="court-location" class="card"></div>
            </section>

            <!-- NEW: Reviews section (placed directly below Location) -->
            <section class="home-section" id="reviews-section">
                <h2 class="home-section-title">Reviews</h2>

                <div class="profile-actions" style="margin-bottom: 12px;">
                    <a id="btn-leave-review" class="btn btn-ghost" href="Login Page.html">Leave a review</a>
                </div>

                <div id="court-reviews" class="card-grid"></div>
            </section>
        </main>

        <script defer src="scripts.js"></script>

                qc_community: {

                pasig_riverside: {

                    amenities: ["Street parking", "Nearby café", "Public restrooms (park)"],
                    rates: ["₱200 / hour (daytime)", "₱300 / hour (with lights)"],
                    rules: ["No glass bottles", "Clean as you go"],

                        { time: "6:00 AM - 7:00 AM", court: "Court 1", status: "Available" },
                        { time: "7:00 AM - 8:00 AM", court: "Court 2", status: "Available" },
                        { time: "8:00 AM - 9:00 AM", court: "Court 1", status: "Limited" },
                    ],
                    locationNotes: [
                        "Morning sessions are cooler and less crowded.",
                        "Some areas may be slippery after rain.",
                    ],
                },
            };

            function renderListLines(el, items) {
                if (!el) return;
                el.innerHTML = items.map((x) => `<p class="card-text">${x}</p>`).join("");
            }

            function renderAvailability(el, slots, loggedIn, courtName) {
                if (!el) return;

                el.innerHTML = slots
                    .map((s) => {
                        const disabled = s.status.toLowerCase() === "full";
                        const href = loggedIn ? "#" : "Login Page.html";
                        const label = disabled ? "Unavailable" : "Reserve";
                        return `
                            <article class="card">
                                <h3 class="card-title">${s.time}</h3>
                                <p class="card-text">${s.court} · <strong>${s.status}</strong></p>
                                <a class="card-link" href="${href}" ${disabled ? 'onclick="return false;"' : ""} data-reserve="1">${label}</a>
                            </article>
                        `;
                    })
                    .join("");

                if (loggedIn) {
                el.querySelectorAll('a[data-reserve="1"]').forEach((a) => {
                    a.addEventListener("click", (e) => {
                        e.preventDefault();
                        alert(`Sample booking flow for ${courtName}: (not implemented yet).`);
                    });
                });
                }

            }

            (function initCourtProfile() {
                const params = new URLSearchParams(window.location.search);
                const key = params.get("court") || "greenhills2";
                const court = COURTS[key] || COURTS.greenhills2;

                const avatarEl = document.getElementById("court-avatar");
                const nameEl = document.getElementById("court-name");
                const metaEl = document.getElementById("court-meta");

                if (avatarEl) avatarEl.textContent = court.initials;
                if (nameEl) nameEl.textContent = court.name;

                if (metaEl) {
                    metaEl.innerHTML = `
                        <strong>${court.type}</strong> · <strong>${court.surface}</strong> · <strong>${court.courts} courts</strong><br>
                        ${court.address}
                    `;
                }

                renderListLines(document.getElementById("court-amenities"), court.amenities);
                renderListLines(document.getElementById("court-rates"), court.rates);
                renderListLines(document.getElementById("court-rules"), court.rules);

                const loggedIn = localStorage.getItem(AUTH_KEY) === "1";

                renderAvailability(
                    document.getElementById("court-availability"),
                    court.availability,
                    loggedIn,
                    court.name
                );

                const locEl = document.getElementById("court-location");
                if (locEl) {
                    locEl.innerHTML = court.locationNotes.map((x) => `<p class="card-text">${x}</p>`).join("");
                }

                const bookBtn = document.getElementById("btn-book");
                if (bookBtn) {
                    if (loggedIn) {
                        bookBtn.href = `Court Reservation Page.html?court=${encodeURIComponent(key)}`;
                    } else {
                        bookBtn.href = "Login Page.html";
                    }
                }

            })();
        </script>
    </body>
</html>
