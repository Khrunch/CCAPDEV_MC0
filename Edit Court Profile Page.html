<!DOCTYPE html>
<html>
    <head>
        <title>TerryPick! - Edit Court Profile</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/16117/16117721.png">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="top-nav">
            <div class="top-nav-left">
                <a href="Home Page.html" class="brand">
                    <img src="https://cdn-icons-png.flaticon.com/512/16117/16117721.png" alt="TerryPick Logo" class="logo">
                    <span class="brand-text">TerryPick</span>                    
                </a>
            </div>
            <div class="top-nav-right">
                <a href="About Us.html">About Us</a>
                <a class="btn btn-ghost" href="Home Page.html">Home</a>
            </div>
        </div>

        <main class="page">
            <section class="profile-hero">
                <div id="edit-court-avatar" class="profile-avatar" aria-hidden="true">CO</div>
                <div class="profile-hero-text">
                    <h1 id="edit-court-name-header" class="profile-name">Loading...</h1>
                    <p id="edit-court-meta" class="profile-meta">Location: <strong>...</strong></p>
                </div>
            </section>

            <section class="profile-hero">
                <div class="profile-hero-text">
                    <h1 class="profile-name">Edit Court Profile</h1>
                    <form action="/edit-court-profile" method="post">
                        
                        <input type="hidden" id="edit-original-court-name" name="original-court-name">

                        <label for="court-name">Court Display Name</label>
                        <input type="text" id="court-name" name="court-name" required>

                        <label for="location">Address</label>
                        <input type="text" id="location" name="location" required>

                        <label for="description">General Description</label>
                        <textarea id="description" name="description" style="box-sizing: border-box; width: 100%; padding: 10px 2.5px; margin: 0 0 20px; border: none; border-bottom: 1px solid #ccc; font-family: 'Montserrat', sans-serif; font-size: 14px; background: transparent;"></textarea>

                        <label for="amenities">Amenities (Comma separated: Parking, Showers, etc.)</label>
                        <input type="text" id="amenities" name="amenities">

                        <label for="rates">Rate per Hour (PHP)</label>
                        <input type="number" id="rates" name="rates" style="box-sizing: border-box; width: 100%; padding: 10px 2.5px; margin: 0 0 20px; border: none; border-bottom: 1px solid #ccc; font-family: 'Montserrat', sans-serif; font-size: 14px; background: transparent;">

                        <button type="submit" class="btn btn-primary">Update Court</button>
                    </form>
                </div>
            </section>
        </main>
        <script defer src="scriptsUpdated.js"></script>
    </body>
</html>
