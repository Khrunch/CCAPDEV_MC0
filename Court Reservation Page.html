<!DOCTYPE html>
<html>
    <head>
        <title>TerryPick! - Court Reservation Page</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/16117/16117721.png">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="top-nav">
            <div class="top-nav-left">
                <a href="Home Page.html" class="brand">
                    <img src="https://cdn-icons-png.flaticon.com/512/16117/16117721.png" alt="TerryPick Logo" class="logo">
                    <span class="brand-text">TerryPick</span>
                </a>
            </div>

            <!-- 3 dot thingy -->
            <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="top-nav-menu">
                &#8942;
            </button>

            <div class="top-nav-right" id="top-nav-menu">
                <!-- keep links here (or ones your JS shows/hides) -->
                <a href="About Us.html">About Us</a>
                <a id="back-to-court" class="btn btn-ghost" href="Court Profile Page.html">Back to Court</a>
                <a class="btn btn-ghost" href="Home Page.html">Home</a>
                <a id="nav-login" href="Login Page.html">Login</a>
                <a id="nav-profile" class="btn btn-ghost" href="Profile Page.html" style="display:none;">Profile</a>
                <a id="nav-owner" class="btn btn-ghost" href="Owner Dashboard.html" style="display:none;">Owner Dashboard</a>
                <a id="nav-primary" class="btn btn-primary" href="Signup Page.html">Sign Up</a>
            </div>
        </div>

        <main class="page">
            <section class="reservation">
                <header class="reservation-header">
                    <div>
                        <h1 class="home-section-title" style="margin-bottom: 6px;">Reserve a slot</h1>
                        <p class="card-text" style="margin: 0;">
                            Court: <strong id="res-court-name">—</strong>
                        </p>
                    </div>

                    <div class="reservation-controls">
                        <button id="week-prev" class="btn btn-ghost" type="button">← Prev</button>
                        <div id="week-label" class="reservation-week-label">Current week</div>
                        <button id="week-next" class="btn btn-ghost" type="button">Next →</button>
                    </div>
                </header>

                <div id="reservation-calendar" class="week-calendar" aria-label="Weekly calendar"></div>

                <footer class="reservation-footer">
                    <div class="card-text" style="margin: 0;">
                        Selected: <strong id="selected-count">0</strong>
                    </div>

                    <div class="reservation-actions">
                        <button id="clear-selection" class="btn btn-ghost" type="button">Clear</button>
                        <button id="reserve-selected" class="btn btn-primary" type="button">Reserve selected</button>
                    </div>
                </footer>

                <div id="selected-list" class="selected-list" aria-label="Selected times"></div>
            </section>
        </main>

        <script src="scripts.js"></script>
    </body>
</html>
