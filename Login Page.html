<!DOCTYPE html>
<html>
    <head>
        <title>TerryPick! - Login</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/16117/16117721.png">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="container">
            <div class="top-nav">
                <div class="top-nav-left">
                    <a href="Home Page.html" class="brand">
                        <img src="https://cdn-icons-png.flaticon.com/512/16117/16117721.png" alt="TerryPick Logo" class="logo">
                        <span class="brand-text">TerryPick</span>
                    </a>
                </div>

                <div class="top-nav-right">
                    <a href="Signup Page.html">Sign Up</a>
                </div>
            </div>

            <div class="login-form">
                <h1>Welcome to TerryPick!</h1>
                <form action="/login" method="post">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>

                    <button type="submit">Login</button>
                </form>
                <p>Don't have an account? <a href="Signup Page.html">Sign Up</a></p>
            </div>
        </div>

        <script defer src="scripts.js"></script>
    </body>
</html>
