<!DOCTYPE html>
<html>
    <head>
        <title>TerryPick! - Owner Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/16117/16117721.png">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="top-nav">
            <div class="top-nav-left">
                <a href="Home Page.html" class="brand">
                    <img src="https://cdn-icons-png.flaticon.com/512/16117/16117721.png" alt="TerryPick Logo" class="logo">
                    <span class="brand-text">TerryPick</span>
                </a>
            </div>
            <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="top-nav-menu">&#8942;</button>
            <div class="top-nav-right" id="top-nav-menu">
                <a href="About Us.html">About Us</a>
                <a class="btn btn-ghost" href="Home Page.html">Home</a>
                <a class="btn btn-primary" href="#" data-action="logout">Log out</a>
            </div>
        </div>

        <main class="page">
            <section class="profile-hero">
                <div class="profile-avatar" aria-hidden="true">CO</div>
                <div class="profile-hero-text">
                    <h1 class="profile-name">Court Owner Dashboard</h1>
                    <p id="owner-subtitle" class="profile-meta">Manage your court, reservations, and profile.</p>
                    <div class="profile-actions">
                        <a id="owner-view-court" class="btn btn-ghost" href="#">View public court page</a>
                        <a class="btn btn-primary" href="Edit Court Profile Page.html" id="btn-edit-court">Edit court profile</a>
                    </div>
                </div>
            </section>

            <section class="home-section">
                <h2 class="home-section-title">Reservation requests</h2>
                <div id="owner-requests-grid" class="card-grid"></div>
            </section>
        </main>
        
        <script defer src="scriptsUpdated.js"></script>
        <script>
            // Setup the 'View Court' dynamic link quickly
            document.addEventListener("DOMContentLoaded", () => {
                const court = localStorage.getItem("tp_owner_court");
                const viewCourt = document.getElementById("owner-view-court");
                if (viewCourt && court) viewCourt.href = `Court Profile Page.html?court=${encodeURIComponent(court)}`;
            });
        </script>
    </body>
</html>
