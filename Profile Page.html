<!DOCTYPE html>
<html>
    <head>
        <title>TerryPick! - Profile</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/16117/16117721.png">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="top-nav">
            <div class="top-nav-left">
                <a href="Home Page.html" class="brand">
                    <img src="https://cdn-icons-png.flaticon.com/512/16117/16117721.png" alt="TerryPick Logo" class="logo">
                    <span class="brand-text">TerryPick</span>                    
                </a>
            </div>
            <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="top-nav-menu">&#8942;</button>
            <div class="top-nav-right" id="top-nav-menu">
                <a href="About Us.html">About Us</a>
                <a class="btn btn-ghost" href="Home Page.html">Home</a>
            </div>
        </div>

        <main class="page">
            <section class="profile-hero">
                <div id="profile-avatar" class="profile-avatar" aria-hidden="true">TP</div>
                <div class="profile-hero-text">
                    <h1 id="profile-name" class="profile-name">Profile</h1>
                    <p class="profile-meta">Username: <strong id="profile-username">—</strong> · Member since <strong id="profile-member-since">2026</strong></p>
                    
                    <p id="profile-bio-text" class="card-text" style="margin-top: 10px; font-style: italic;"></p>

                    <div class="profile-actions" style="margin-top: 20px;">
                        <a class="btn btn-primary" href="Edit User Profile Page.html">Edit profile</a>
                        <a class="btn btn-ghost" href="#" data-action="logout">Log out</a>
                    </div>
                </div>
            </section>

            <section class="home-section">
                <h2 class="home-section-title">Your quick stats</h2>
                <div class="profile-stats">
                    <article class="stat">
                        <p id="stat-total-bookings" class="stat-number">0</p>
                        <p class="stat-label">Total Bookings</p>
                    </article>
                    <article class="stat">
                        <p id="stat-favorites" class="stat-number">0</p>
                        <p class="stat-label">Favorites</p>
                    </article>
                    <article class="stat">
                        <p id="stat-upcoming" class="stat-number">0</p>
                        <p class="stat-label">Upcoming</p>
                    </article>
                </div>
            </section>

            <section class="home-section">
                <h2 class="home-section-title">Upcoming bookings</h2>
                <div id="upcoming-bookings-grid" class="card-grid"></div>
            </section>

            <section class="home-section">
                <h2 class="home-section-title">Saved courts</h2>
                <div id="saved-courts-grid" class="card-grid"></div>
            </section>
        </main>

        <script defer src="scriptsUpdated.js"></script>
    </body>
</html>
